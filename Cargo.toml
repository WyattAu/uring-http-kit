[workspace]
resolver = "3"
members = ["crates/sqlite-btree", "crates/uring-http", "server"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/uring-http-kit"

[workspace.dependencies]
io-uring = "0.7"
libc = "0.2"
proptest = "1"
memmap2 = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
uring-kit = { git = "https://github.com/WyattAu/uring-kit", rev = "c62eab886ec7a782b23b6df30c567648df7fba0c" }
